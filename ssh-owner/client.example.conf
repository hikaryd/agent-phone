# Documentation-only TEST-NET endpoints and synthetic Termux UID.
# Render a private copy with real addresses/UID and trusted known_hosts entries.
# IdentityFile selects the owner's PUBLIC key held by their SSH/password agent;
# no private key belongs in this repository. Do not grant this identity to Agent.
Host phone phone-remote phone-vps
    IdentityFile ~/.ssh/phone-owner.pub
    IdentitiesOnly yes
    ForwardAgent no
    StrictHostKeyChecking yes
    UserKnownHostsFile ~/.ssh/phone-owner-known_hosts
    ServerAliveInterval 15
    ServerAliveCountMax 3

Host phone
    HostName 192.0.2.116
    Port 8022
    User u0_a123
    HostKeyAlias phone-owner

Host phone-remote
    HostName 127.0.0.1
    Port 19223
    User u0_a123
    HostKeyAlias phone-owner
    ProxyJump phone-vps

Host phone-vps
    HostName 203.0.113.20
    User phone-owner-jump
